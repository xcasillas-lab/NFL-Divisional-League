name: DFFL live scoring test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scores:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Update live-test scores
        env:
          DFFL_TEST_DATE: "20260822"
        run: python scripts/update_scores.py

      - name: Commit score update
        run: |
          git config user.name "dffl-scorebot"
          git config user.email "actions@users.noreply.github.com"
          git add scoring-data/week1-scores-live-test.json
          if git diff --cached --quiet; then
            echo "No score changes to commit."
          else
            git commit -m "Update DFFL live-test scores"
            git push
          fi
